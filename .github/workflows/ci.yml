name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: tests (${{ matrix.os }}, ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      # No pip install step: the project is standard library only.
      # 没有 pip 安装步骤：本项目只使用标准库。
      - name: Run the test suite
        run: python -m unittest discover -s tests -t . -v

      # The bilingual comment rule is enforced, not just documented.
      # 双语注释规范是被强制的，而不只是写在文档里。
      - name: Check that comments and docstrings stay bilingual
        run: python tools/check_comments.py
